<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="detTitle detDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="detTitle">Why the next step is deterministic</title>
  <desc id="detDesc">A different agent, a different model, and a brand-new session all converge on the same thing: the gentle-ai binary. It reads the change state from files on disk and returns the only valid next transition, so no model votes on what comes next. The answer is always one of four public states — Working, Checking, Ready, or Needs your decision — and asking again tomorrow from another agent returns the same answer, because it was derived rather than improvised.</desc>

  <defs>
    <radialGradient id="detAmbient" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F095C8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F095C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1240" height="680" rx="24" fill="#1A1218"/>
  <rect width="1240" height="680" rx="24" fill="url(#detAmbient)"/>

  <!-- header -->
  <text x="40" y="58" font-size="27" font-weight="700" fill="#F7ECF2">Deterministic by design</text>
  <text x="41" y="88" font-size="14.5" fill="#A88E9B">Change the agent, the model, the day. The next valid step does not move.</text>
  <rect x="946" y="38" width="254" height="34" rx="17" fill="#2C1F27" stroke="#4A3540"/>
  <text x="1073" y="60" font-size="12.5" text-anchor="middle" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">derived &#183; never improvised</text>

  <text x="40" y="160" font-size="12" font-weight="700" letter-spacing="2" fill="#D7A0B8"><tspan fill="#F095C8" opacity="0.5">01 </tspan>WHOEVER ASKS</text>
  <text x="390" y="160" font-size="12" font-weight="700" letter-spacing="2" fill="#D7A0B8"><tspan fill="#F095C8" opacity="0.5">02 </tspan>ONE ENGINE</text>
  <text x="830" y="160" font-size="12" font-weight="700" letter-spacing="2" fill="#D7A0B8"><tspan fill="#F095C8" opacity="0.5">03 </tspan>ONE ANSWER</text>

  <!-- ============ 01 the askers ============ -->
  <rect x="40" y="182" width="250" height="92" rx="16" fill="#221820" stroke="#392A33"/>
  <text x="64" y="220" font-size="15" font-weight="600" fill="#F7ECF2">A different agent</text>
  <text x="64" y="244" font-size="11.5" fill="#9C8391">Pi, Codex, OpenCode, Claude Code</text>

  <rect x="40" y="292" width="250" height="92" rx="16" fill="#221820" stroke="#392A33"/>
  <text x="64" y="330" font-size="15" font-weight="600" fill="#F7ECF2">A different model</text>
  <text x="64" y="354" font-size="11.5" fill="#9C8391">Any of them. It is not consulted.</text>

  <rect x="40" y="402" width="250" height="92" rx="16" fill="#221820" stroke="#392A33"/>
  <text x="64" y="440" font-size="15" font-weight="600" fill="#F7ECF2">A brand-new session</text>
  <text x="64" y="464" font-size="11.5" fill="#9C8391">Zero history in the window</text>

  <!-- converging -->
  <path d="M290 228 C 334 228, 342 308, 382 308" fill="none" stroke="#6B4F5D" stroke-width="1.8"/>
  <path d="M376 303 L384 308 L376 313" fill="none" stroke="#6B4F5D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 338 L382 338" fill="none" stroke="#6B4F5D" stroke-width="1.8"/>
  <path d="M376 333 L384 338 L376 343" fill="none" stroke="#6B4F5D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 448 C 334 448, 342 368, 382 368" fill="none" stroke="#6B4F5D" stroke-width="1.8"/>
  <path d="M376 363 L384 368 L376 373" fill="none" stroke="#6B4F5D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ 02 the engine ============ -->
  <rect x="390" y="182" width="380" height="312" rx="18" fill="#241A22" stroke="#F095C8" stroke-opacity="0.5"/>
  <text x="414" y="240" font-size="19" font-weight="600" fill="#F7ECF2">The binary decides</text>
  <text x="414" y="266" font-size="12.5" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gentle-ai</text>
  <line x1="414" y1="286" x2="746" y2="286" stroke="#4A3540"/>
  <text x="414" y="316" font-size="12" fill="#9C8391">It reads the state of the change</text>
  <text x="414" y="334" font-size="12" fill="#9C8391">from files on disk, then returns the</text>
  <text x="414" y="352" font-size="12" fill="#9C8391">only transition that is valid next.</text>
  <line x1="414" y1="376" x2="746" y2="376" stroke="#4A3540"/>
  <text x="414" y="402" font-size="11" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">openspec/changes/&lt;change&gt;/</text>
  <text x="414" y="438" font-size="13.5" font-weight="700" fill="#F095C8">No model votes on this.</text>

  <path d="M770 338 L822 338" stroke="#F095C8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M815 331 L824 338 L815 345" fill="none" stroke="#F095C8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ 03 the answer ============ -->
  <rect x="830" y="182" width="370" height="312" rx="18" fill="#221820" stroke="#392A33"/>
  <text x="854" y="240" font-size="19" font-weight="600" fill="#F7ECF2">One valid next step</text>
  <text x="854" y="266" font-size="12" fill="#9C8391">Always one of four public states.</text>
  <line x1="854" y1="286" x2="1176" y2="286" stroke="#4A3540"/>

  <rect x="854" y="304" width="250" height="28" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <circle cx="872" cy="318" r="4" fill="#D7A0B8"/>
  <text x="888" y="323" font-size="12" fill="#D7A0B8">Working</text>
  <rect x="854" y="340" width="250" height="28" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <circle cx="872" cy="354" r="4" fill="#D7A0B8"/>
  <text x="888" y="359" font-size="12" fill="#D7A0B8">Checking</text>
  <rect x="854" y="376" width="250" height="28" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <circle cx="872" cy="390" r="4" fill="#D7A0B8"/>
  <text x="888" y="395" font-size="12" fill="#D7A0B8">Ready</text>
  <rect x="854" y="412" width="250" height="28" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <circle cx="872" cy="426" r="4" fill="#D7A0B8"/>
  <text x="888" y="431" font-size="12" fill="#D7A0B8">Needs your decision</text>

  <text x="1176" y="466" font-size="11" text-anchor="end" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gentle-ai.sdd-status/v2</text>

  <!-- payoff strip -->
  <rect x="40" y="546" width="1160" height="54" rx="16" fill="#2A1B24" stroke="#5A3A49"/>
  <text x="620" y="571" font-size="15" font-weight="700" text-anchor="middle" fill="#F095C8">Same question, same answer</text>
  <text x="620" y="591" font-size="12" text-anchor="middle" fill="#A88E9B">Ask again tomorrow, from another agent, on another model. The state lives in files, so the answer is read &#8212; not invented.</text>

  <text x="620" y="644" font-size="12" text-anchor="middle" fill="#8A6E7C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gentle-ai sdd status</text>
</svg>
