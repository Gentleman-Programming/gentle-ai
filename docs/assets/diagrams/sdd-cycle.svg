<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="sddTitle sddDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="sddTitle">The Spec-Driven Development cycle</title>
  <desc id="sddDesc">SDD is selected only by an explicit request or an accepted proposal. After exploration, optional research can add evidence. Proposal, specification, design, and tasks create formal planning artifacts. Apply uses the configured TDD mode. Optional Verify can diagnose partial work and report practical findings, but does not gate Archive: a separate path leads from Apply straight to Archive when Verify is skipped. Archive records actual state and history, including unfinished work when explicitly archived. It is not shipping, approval, or an RDD review.</desc>

  <defs>
    <radialGradient id="sddAmbient" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F095C8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F095C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1240" height="760" rx="24" fill="#1A1218"/>
  <rect width="1240" height="760" rx="24" fill="url(#sddAmbient)"/>

  <!-- header -->
  <text x="40" y="58" font-size="27" font-weight="700" fill="#F7ECF2">SDD &#8212; formal phases when you choose them</text>
  <text x="41" y="88" font-size="14.5" fill="#A88E9B">A deliberately selected change gets visible planning artifacts and a recorded history.</text>
  <rect x="872" y="38" width="328" height="34" rx="17" fill="#2C1F27" stroke="#4A3540"/>
  <text x="1036" y="60" font-size="12.5" text-anchor="middle" fill="#D7A0B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">explicit request &#183; accepted proposal</text>

  <!-- understand -->
  <rect x="40" y="130" width="1160" height="154" rx="20" fill="#221820" stroke="#392A33"/>
  <text x="68" y="202" font-size="34" font-weight="700" fill="#F095C8" opacity="0.22">01</text>
  <text x="68" y="228" font-size="13" font-weight="700" letter-spacing="2" fill="#D7A0B8">UNDERSTAND</text>
  <line x1="200" y1="158" x2="200" y2="256" stroke="#392A33"/>

  <rect x="224" y="164" width="284" height="88" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <text x="244" y="198" font-size="17" font-weight="600" fill="#F7ECF2">Explore</text>
  <text x="244" y="224" font-size="11.5" fill="#9C8391">Current code, requirements and scope</text>

  <path d="M518 208 L558 208" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round"/>
  <path d="M551 202 L559 208 L551 214" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="568" y="164" width="284" height="88" rx="14" fill="#2C1F27" stroke="#4A3540" stroke-dasharray="5 4"/>
  <text x="588" y="198" font-size="17" font-weight="600" fill="#F7ECF2">Research</text>
  <text x="830" y="187" font-size="10" text-anchor="end" letter-spacing="1" fill="#8A6E7C">OPTIONAL</text>
  <text x="588" y="224" font-size="11.5" fill="#9C8391">Evidence for a real uncertainty</text>

  <rect x="892" y="164" width="284" height="88" rx="14" fill="#2A1B24" stroke="#F095C8" stroke-opacity="0.45"/>
  <text x="912" y="198" font-size="17" font-weight="600" fill="#F7ECF2">Selected deliberately</text>
  <text x="912" y="224" font-size="11.5" fill="#D7A0B8">Never chosen by size, risk or ambiguity</text>

  <!-- plan -->
  <rect x="40" y="316" width="1160" height="168" rx="20" fill="#221820" stroke="#392A33"/>
  <text x="68" y="394" font-size="34" font-weight="700" fill="#F095C8" opacity="0.22">02</text>
  <text x="68" y="420" font-size="13" font-weight="700" letter-spacing="2" fill="#D7A0B8">PLAN</text>
  <line x1="200" y1="344" x2="200" y2="456" stroke="#392A33"/>

  <rect x="224" y="350" width="223" height="100" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <text x="242" y="382" font-size="17" font-weight="600" fill="#F7ECF2">Proposal</text>
  <text x="242" y="408" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">proposal.md</text>
  <text x="242" y="430" font-size="11.5" fill="#9C8391">Intent, scope and approach</text>

  <path d="M457 394 L466 394" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round"/>
  <path d="M459 388 L467 394 L459 400" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="467" y="350" width="223" height="100" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <text x="485" y="382" font-size="17" font-weight="600" fill="#F7ECF2">Spec</text>
  <text x="485" y="408" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spec.md</text>
  <text x="485" y="430" font-size="11.5" fill="#9C8391">Requirements and scenarios</text>

  <path d="M700 394 L709 394" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round"/>
  <path d="M702 388 L710 394 L702 400" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="710" y="350" width="223" height="100" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <text x="728" y="382" font-size="17" font-weight="600" fill="#F7ECF2">Design</text>
  <text x="728" y="408" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">design.md</text>
  <text x="728" y="430" font-size="11.5" fill="#9C8391">Architecture decisions</text>

  <path d="M943 394 L952 394" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round"/>
  <path d="M945 388 L953 394 L945 400" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="953" y="350" width="223" height="100" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <text x="971" y="382" font-size="17" font-weight="600" fill="#F7ECF2">Tasks</text>
  <text x="971" y="408" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tasks.md</text>
  <text x="971" y="430" font-size="11.5" fill="#9C8391">Ordered, checkable work</text>

  <!-- execute -->
  <rect x="40" y="516" width="1160" height="172" rx="20" fill="#221820" stroke="#392A33"/>
  <text x="68" y="596" font-size="34" font-weight="700" fill="#F095C8" opacity="0.22">03</text>
  <text x="68" y="622" font-size="13" font-weight="700" letter-spacing="2" fill="#D7A0B8">EXECUTE</text>
  <line x1="200" y1="544" x2="200" y2="660" stroke="#392A33"/>

  <rect x="224" y="550" width="280" height="104" rx="14" fill="#2C1F27" stroke="#4A3540"/>
  <text x="244" y="583" font-size="17" font-weight="600" fill="#F7ECF2">Apply</text>
  <text x="244" y="609" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">configured TDD</text>
  <text x="244" y="631" font-size="11.5" fill="#9C8391">Implement the planned work</text>

  <path d="M514 602 L566 602" stroke="#F095C8" stroke-width="2" stroke-linecap="round"/>
  <path d="M559 596 L567 602 L559 608" fill="none" stroke="#F095C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="576" y="550" width="280" height="104" rx="14" fill="#2C1F27" stroke="#4A3540" stroke-dasharray="5 4"/>
  <text x="596" y="583" font-size="17" font-weight="600" fill="#F7ECF2">Verify</text>
  <text x="834" y="572" font-size="10" text-anchor="end" letter-spacing="1" fill="#8A6E7C">OPTIONAL</text>
  <text x="596" y="609" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">practical diagnostics</text>
  <text x="596" y="631" font-size="11.5" fill="#9C8391">Can inspect partial work and findings</text>

  <path d="M866 602 L918 602" stroke="#F095C8" stroke-width="2" stroke-linecap="round"/>
  <path d="M911 596 L919 602 L911 608" fill="none" stroke="#F095C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="928" y="550" width="248" height="104" rx="14" fill="#2A1B24" stroke="#F095C8" stroke-opacity="0.55"/>
  <text x="948" y="583" font-size="17" font-weight="600" fill="#F7ECF2">Archive</text>
  <text x="948" y="609" font-size="12" fill="#F095C8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">actual state + history</text>
  <text x="948" y="631" font-size="11.5" fill="#D7A0B8">May record unfinished work honestly</text>

  <!-- Verify is skippable: Apply can reach Archive directly. -->
  <path d="M364 654 V676 H646" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M770 676 H1052 V660" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1045 667 L1052 658 L1059 667" fill="none" stroke="#6B4F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="708" y="680" font-size="10.5" text-anchor="middle" letter-spacing="1" fill="#8A6E7C">SKIP VERIFY</text>

  <!-- footer -->
  <line x1="40" y1="710" x2="1200" y2="710" stroke="#392A33"/>
  <text x="620" y="736" font-size="12.5" text-anchor="middle" fill="#8A6E7C">Verify is not an archive gate. Archive is not shipping, approval or RDD &#8212; ordinary delivery policy remains separate.</text>
</svg>
