workspace:
  name: "Axiom"
  topology: "monorepo-embedded"
  specs_repository: "openspec"
  root: "."

roles:
  core:
    name: "Axiom Core Engine"
    repositories:
      - path: "."
    tech:
      - "go"
      - "bubbletea"

  qa:
    name: "Quality Assurance & Verification"
    repositories:
      - path: "."
    tech:
      - "go-test"

  e2e:
    name: "E2E & Automation Testing"
    repositories:
      - path: "."
    tech:
      - "automation"

governance:
  language: "es"
  shared_memory: "engram"
