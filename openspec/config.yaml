# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Go 1.25.10, module github.com/gentleman-programming/gentle-ai/v2
  Bubbletea TUI (charmbracelet/bubbletea v1.3.10), lipgloss v1.1.0
  Architecture: cmd/gentle-ai entrypoint, internal/ packages (agents, tui, model,
  pipeline, catalog, system, planner, verify, update, opencode, installcmd, cli,
  app, components, state, backup, assets, agentbuilder), contracts/ (review-
  integration, review-provider-contract, sdd-integration)
  Secondary module: bench/ (github.com/gentleman-programming/gentle-ai/bench) —
  deliberately separate go.mod; root `go test/vet/build ./...` never covers it
  Agents: multi-agent support (claude, opencode, cursor, codex, gemini, vscode,
  windsurf, antigravity)
  Skills catalog: internal/catalog/skills.go; project skills in skills/
  Build: goreleaser (.goreleaser.yaml), CI: GitHub Actions (ci.yml, pr-check.yml,
  release.yml, promote-stable-rc.yml, windows-full-suite.yml)
  Style: go run ./internal/gofmtcheck (custom AST-based formatting gate, not
  plain gofmt -l), go vet, no golangci-lint config found

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected internal/ packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex TUI flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Load gentleman-bubbletea skill for TUI work (internal/tui/)
    - Load gentleman-installer skill for installation steps
    - Load gentleman-system skill for OS/system detection
    - Load go-testing skill when writing tests
    - Follow existing code patterns in internal/ packages
  verify:
    - Run: go test ./...
    - Run: go vet ./...
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: "2026-09-02"

  projects:
    - path: "."
      stack: "Go 1.25.10 (module .../gentle-ai/v2) — CLI/TUI product"
      test_command: "go test ./..."
      framework: "Go standard testing"
      note: "725 _test.go files repo-wide; CI-required on every PR (ci.yml unit-tests job)"
    - path: "bench/"
      stack: "Go 1.25.10 (module .../gentle-ai/bench) — benchmark/journey harness"
      test_command: "cd bench && go test ./..."
      framework: "Go standard testing"
      note: >-
        Deliberately independent go.mod (see bench/README.md); root
        go build/vet/test ./... never sees it. CI builds and tests it in a
        separate step. Not required for every change — CONTRIBUTING.md scopes
        benchmark validation to review-lifecycle/gate/recovery/delivery/
        benchmark-affecting changes and marks it N/A otherwise. Excluded from
        the workspace-level strict_tdd gate below by explicit project design.

  runner:
    command: "go test ./..."
    framework: "Go standard testing"
    note: "Workspace-level gate scoped to the root module (`.`); see testing.projects for bench/'s independent command."

  layers:
    unit:
      available: true
      tool: "go test"
      note: "725 _test.go files across internal/, cmd/, contracts/, bench/"
    integration:
      available: true
      tool: "net/http/httptest (built-in)"
    e2e:
      available: true
      tool: "Docker-based E2E (e2e/docker-test.sh, e2e/e2e_test.sh)"
      note: "Dockerfile.ubuntu, Dockerfile.fedora, Dockerfile.arch, Dockerfile.claude-network-none — Tier 1 always runs; Tier 2 (RUN_FULL_E2E=1) and backup tests (RUN_BACKUP_TESTS=1) are opt-in"
    tui:
      available: true
      tool: "bubbletea tea.KeyMsg simulation (no teatest — direct model.Update() testing)"
      note: "TUI tests use direct Bubbletea model updates, not teatest library"

  coverage:
    available: true
    command: "go test -cover ./..."

  quality:
    linter:
      available: false
      note: "No golangci-lint config found; go vet is available"
    type_checker:
      available: true
      command: "go vet ./..."
    formatter:
      available: true
      command: "go run ./internal/gofmtcheck"
      note: "Custom formatting gate (internal/gofmtcheck), enforced in CI's go-format job; not plain `gofmt -l`"
