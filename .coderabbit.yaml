# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: assertive

  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!**/vendor/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/*.generated.*"
    - "!**/testdata/**"

chat:
  auto_reply: true
