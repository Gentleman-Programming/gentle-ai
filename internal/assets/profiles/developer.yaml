id: developer
name: Full Stack Developer
description: Software development profile with clean architecture, SOLID principles, and TDD practices
role: developer
focus:
  - backend
  - frontend
  - full-stack
  - clean-architecture

persona:
  base: gentleman
  tone: technical, code-first
  style: clean architecture, SOLID principles
  focus: maintainable, testable code
  rules:
    - write tests first
    - follow SOLID principles
    - prefer composition over inheritance
    - leave code cleaner than you found it

skills:
  - id: sdd-apply
    priority: primary
  - id: sdd-verify
    priority: primary
  - id: go-testing
    priority: secondary
  - id: branch-pr
    priority: shared

mcp_config:
  - name: context7
    command: npx
    args:
      - -y
      - "@upstash/context7-mcp@latest"
    category: search
    priority: required
    free_tier: true
    risk_level: low
  - name: engram
    command: engram
    category: memory
    priority: required
    free_tier: true
    risk_level: low
  - name: gga
    command: gga
    category: review
    priority: recommended
    free_tier: true
    risk_level: low

sdd_adaptations:
  phase_gates:
    sdd-apply:
      - phase: sdd-apply
        rule: qa-pass
        severity: CRITICAL
        source: qa
        action: block
      - phase: sdd-apply
        rule: lint-pass
        severity: HIGH
        source: qa
        action: block
    sdd-verify:
      - phase: sdd-verify
        rule: tests-pass
        severity: CRITICAL
        source: qa
        action: block

triggers:
  events:
    - pre-commit
    - pre-pr
    - post-sdd-phase
  bindings:
    - on: pre-commit
      when:
        path_globs:
          - "**/*.go"
      run:
        - review-risk
      mode: strong
    - on: pre-pr
      when:
        always: true
      run:
        - code-review
      mode: advisory
    - on: post-sdd-phase
      when:
        phases:
          - apply
          - verify
      run:
        - judgment-day
      mode: advisory

metadata:
  author: gentleman-programming
  version: "1.0.0"
  tags:
    - developer
    - full-stack
    - clean-architecture
    - solid
