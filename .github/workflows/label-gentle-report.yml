name: Label Automated Provider Reports

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label recognized automated provider report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- gentle-ai-provider-report:v1 -->';
            const issue = context.payload.issue;
            const markerCount = typeof issue.body === 'string'
              ? issue.body.split(marker).length - 1
              : 0;
            if (markerCount !== 1) {
              return;
            }
            const labels = (issue.labels || []).map((label) => label.name);
            if (labels.includes('gentle-report')) {
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['gentle-report'],
            });
