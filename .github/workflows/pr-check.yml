name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

jobs:
  check-pr-size:
    name: Check PR Cognitive Load
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR stays within review budget
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const limit = 400;
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;
            const labels = (pr.labels || []).map(label => label.name);
            const hasException = labels.includes('size:exception');

            console.log(`PR size: +${additions} / -${deletions} = ${total} changed lines`);
            console.log(`Labels: ${labels.join(', ') || '(none)'}`);

            if (total <= limit) {
              console.log(`✅ PR is within the ${limit}-line cognitive review budget.`);
              return;
            }

            const message =
              `PR changes ${total} lines (+${additions}/-${deletions}), exceeding the ${limit}-line cognitive review budget.\n\n` +
              'Why this exists: reviews should stay small enough to complete in ~60 minutes without reviewer fatigue.\n' +
              'Please split this work into chained or stacked PRs, or ask a maintainer for the size:exception label when the large diff is unavoidable.';

            if (hasException) {
              core.warning(`⚠️ ${message}`);
              console.log('✅ size:exception label present; allowing oversized PR with warning.');
              return;
            }

            core.setFailed(`❌ ${message}`);

  check-workflow-scripts:
    name: Check Workflow Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Run workflow script tests
        run: node --test .github/scripts/parse-linked-issues.test.cjs

  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    outputs:
      issue-numbers: ${{ steps.parse.outputs.issue-numbers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Verify PR body references an issue
        id: parse
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const { parseLinkedIssues } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/parse-linked-issues.cjs`
            );

            // Parse the visible body once; HTML comments (like the PR
            // template's `Closes #42` example) are stripped by the shared
            // parser, and check-issue-approved reuses this exact result.
            const issueNumbers = parseLinkedIssues(context.payload.pull_request.body);
            core.setOutput('issue-numbers', JSON.stringify(issueNumbers));

            if (issueNumbers.length === 0) {
              core.setFailed(
                '❌ PR body must reference a linked issue using one of:\n' +
                '  - Closes #<number>\n' +
                '  - Fixes #<number>\n' +
                '  - Resolves #<number>\n\n' +
                'References inside HTML comments (<!-- ... -->) do not count.\n' +
                'Every PR must be linked to an approved issue.'
              );
            } else {
              console.log(`✅ Found issue reference(s): ${issueNumbers.map(n => `#${n}`).join(', ')}`);
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    needs: check-issue-reference
    steps:
      - name: Verify linked issue(s) have status:approved label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          ISSUE_NUMBERS: ${{ needs.check-issue-reference.outputs.issue-numbers }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Reuse the single parse from check-issue-reference; do not
            // re-scan the raw body here (see issue #1770).
            const issueNumbers = JSON.parse(process.env.ISSUE_NUMBERS || '[]');

            if (issueNumbers.length === 0) {
              core.setFailed('❌ Could not find issue reference in PR body.');
              return;
            }
            const failures = [];

            for (const issueNumber of issueNumbers) {
              console.log(`Checking issue #${issueNumber} for status:approved label...`);

              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                failures.push(`❌ Could not fetch issue #${issueNumber}: ${err.message}`);
                continue;
              }

              const labels = issue.labels.map(l => l.name);
              console.log(`Labels on issue #${issueNumber}: ${labels.join(', ') || '(none)'}`);

              if (!labels.includes('status:approved')) {
                failures.push(
                  `❌ Issue #${issueNumber} does not have the "status:approved" label.\n` +
                  '   The linked issue must have status:approved under the canonical issue-creation workflow contract.\n' +
                  '   Without a current direct instruction and target-host capability granting the exact action, comment on the issue and wait.'
                );
              } else {
                console.log(`✅ Issue #${issueNumber} has status:approved.`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n\n'));
            }

  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR has exactly one type:* label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const labels = pr.labels.map(l => l.name);
            const typeLabels = labels.filter(l => l.startsWith('type:'));

            console.log(`All PR labels: ${labels.join(', ') || '(none)'}`);
            console.log(`type:* labels found: ${typeLabels.join(', ') || '(none)'}`);

            if (typeLabels.length === 0) {
              core.setFailed(
                '❌ PR must have exactly one type:* label.\n\n' +
                'Valid labels:\n' +
                '  type:bug, type:feature, type:refactor,\n' +
                '  type:docs, type:chore, type:breaking-change\n\n' +
                'Ask a maintainer to add the appropriate label.'
              );
            } else if (typeLabels.length > 1) {
              core.setFailed(
                `❌ PR has ${typeLabels.length} type:* labels: ${typeLabels.join(', ')}\n` +
                'A PR must have exactly ONE type:* label. Please remove the extra one(s).'
              );
            } else {
              console.log(`✅ PR has type label: ${typeLabels[0]}`);
            }
