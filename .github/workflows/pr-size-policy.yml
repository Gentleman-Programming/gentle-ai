name: PR Size Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  trusted-pr-size-policy:
    name: Report PR Cognitive Load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted policy source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/check-pr-size.cjs
            .github/grandfather-size-exceptions.json
          sparse-checkout-cone-mode: false
      - name: Read live PR facts and report policy result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const path = require('node:path');
            let pr;
            try {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              }));
            } catch (error) {
              core.setFailed(`Unable to read live PR facts: ${error.message}`);
              return;
            }

            try {
              const workspace = process.env.GITHUB_WORKSPACE;
              const { evaluatePrSize, loadPolicy } = require(path.join(workspace, '.github/scripts/check-pr-size.cjs'));
              const policy = loadPolicy(path.join(workspace, '.github/grandfather-size-exceptions.json'));
              const result = evaluatePrSize(pr, policy);
              core.info(`PR size: +${pr.additions} / -${pr.deletions} = ${result.total} changed lines`);
              if (result.outcome === 'warning') core.warning(result.message);
              if (result.enforced) core.setFailed(result.message);
            } catch (error) {
              core.setFailed(`Trusted PR size policy failed closed: ${error.message}`);
            }
