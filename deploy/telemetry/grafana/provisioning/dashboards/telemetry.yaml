# Grafana dashboard provider for the Axiom telemetry usage dashboard.
# Installed by deploy/telemetry/install.sh --with-grafana, which also
# copies ../dashboards/gentle-ai-usage.json into the path below.
apiVersion: 1

providers:
  - name: axiom-telemetry
    orgId: 1
    folder: "Axiom"
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 3600
    options:
      path: /etc/grafana/provisioning/dashboards/axiom
      foldersFromFilesStructure: false
