version: 2

project_name: axiom

before:
  hooks:
    - go run ./internal/providercontractbundlecmd generate --out .goreleaser-provider-contract
    - rm -rf .goreleaser-provenance
    - mkdir -p .goreleaser-provenance
    - go run ./internal/releaseprovenancecmd --out .goreleaser-provenance/manifest.json --config .goreleaser.yaml --goreleaser-version v2.15.2

# Two builds, not a rename: D2.4 keeps `gentle-ai` alive as the deprecation
# alias crosslane's shim and cmd/gentle-ai/main.go both depend on, so the
# release still has to publish that binary alongside the product's own
# (inc-20-upstream-reconciliation, D-08).
builds:
  - id: axiom
    main: ./cmd/axiom
    binary: axiom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X github.com/gentleman-programming/gentle-ai/v3/internal/update/upgrade.releaseMinisignPublicKeys={{ .Env.MINISIGN_PUBLIC_KEYS_CANONICAL }}
  - id: gentle-ai-deprecated
    main: ./cmd/gentle-ai
    binary: gentle-ai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X github.com/gentleman-programming/gentle-ai/v3/internal/update/upgrade.releaseMinisignPublicKeys={{ .Env.MINISIGN_PUBLIC_KEYS_CANONICAL }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/review-integration.md
      - contracts/review-integration/v1/FREEZE.md
      - contracts/review-integration/v1/schemas/*.schema.json
      - contracts/review-integration/v1/fixtures/*.fixture.json
      - contracts/review-integration/v2/schemas/*.schema.json
      - contracts/review-integration/v2/fixtures/*.fixture.json
  - id: review-provider-contract
    meta: true
    formats:
      - tar.gz
    name_template: "gentle-ai-review-provider-contract-{{ .Env.PROVIDER_CONTRACT_SEMVER }}"
    files:
      - src: .goreleaser-provider-contract/README.md
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/manifest.json
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/orchestration/*.md
        dst: orchestration
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/schemas/*.schema.json
        dst: schemas
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: .goreleaser-provider-contract/vectors/*.json
        dst: vectors
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
  - id: release-provenance
    meta: true
    formats:
      - tar.gz
    name_template: "gentle-ai-release-provenance-v1"
    files:
      - src: .goreleaser-provenance/manifest.json
        strip_parent: true
        info:
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Sign only the checksum manifest. The signed trusted comment binds the exact
# repository and tag; the updater rejects a valid signature copied from any
# other release identity.
signs:
  - cmd: minisign
    artifacts: checksum
    signature: ${artifact}.minisig
    args:
      - "-S"
      - "-s"
      - "{{ .Env.MINISIGN_SECRET_KEY_FILE }}"
      - "-m"
      - "${artifact}"
      - "-x"
      - "${signature}"
      - "-c"
      - "signature from gentle-ai release"
      - "-t"
      - "repo=IGutierrezZ/axiom;tag={{ .Tag }}"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Sin bloque `brews:` mientras Axiom no publique su primer release.
#
# El bloque heredado de upstream apuntaba a Gentleman-Programming/homebrew-tap
# con la formula "gentle-ai": publicar desde este fork habria intentado escribir
# en el tap de otro proyecto, que no es un release bajo la identidad de Axiom.
#
# El primer release publica binarios firmados y nada mas. El tap propio se anade
# cuando se decida donde vive, junto con las tareas 4.2 a 4.5 (instalador y
# compuertas), que REQ-20.8 mantiene diferidas hasta que exista ese release.
